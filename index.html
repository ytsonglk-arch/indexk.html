                    {q:"හරිතාගාර ආචරණයට බලපාන වායුව?", a:["CO2","ඔක්සිජන්","නයිට්‍රජන්","හීලියම්"], c:0},
                    {q:"පලිබෝධ පාලනයට යොදාගන්නා ජීවී ක්‍රමය?", a:["රසායනික","ජීව විද්‍යාත්මක","යාන්ත්‍රික","ස්වභාවික"], c:1},
                    {q:"බද්ධ කිරීම යනු?", a:["ලිංගික ප්‍රජනනය","අලිංගික ප්‍රජනනය","බීජ වැවීම","පැළ සිටුවීම"], c:1}
                ]
            },
            'Sinhala': {
                '2023 AL Sinhala I': [
                    {q:"සිංහල හෝඩියේ මුළු අක්ෂර ගණන?", a:["54","60","36","20"], c:1},
                    {q:"ගුත්තිල කාව්‍යයේ කර්තෘ?", a:["වෑත්තෑවේ හිමි","තොටගමුවේ හිමි","වීදාගම හිමි","ශ්‍රී රාහුල හිමි"], c:0},
                    {q:"නූතන සිංහල නවකතාවේ පියා?", a:["මාර්ටින් වික්‍රමසිංහ","පියදාස සිරිසේන","ගුණදාස අමරසේකර","එදිරිවීර සරච්චන්ද්‍ර"], c:1},
                    {q:"මනමේ නාට්‍යයේ නිර්මාණකරු?", a:["සරච්චන්ද්‍ර","වික්‍රමසිංහ","සුගතපාල ද සිල්වා","හෙන්රි ජයසේන"], c:0},
                    {q:"සන්ධි යනු?", a:["අකුරු වෙන් කිරීම","අකුරු එකතු වීම","වචන ලිවීම","ගාථා කීම"], c:1}
                ]
            }
        };

        let activeSubject = "";
        let sessionCorrect = 0, sessionWrong = 0, canClick = true;

        // AUTH & NAVIGATION
        function toggleAuth() { 
            const isLogin = document.getElementById('auth-btn').innerText === "Login";
            document.getElementById('reg-name-div').classList.toggle('hidden', isLogin);
            document.getElementById('auth-btn').innerText = isLogin ? "Register" : "Login";
            document.getElementById('toggle-btn').innerText = isLogin ? "Login" : "Register";
        }

        async function handleAuth() {
            const e = document.getElementById('auth-email').value, p = document.getElementById('auth-password').value;
            try { if(document.getElementById('auth-btn').innerText === "Login") await auth.signInWithEmailAndPassword(e, p); 
                  else { const res = await auth.createUserWithEmailAndPassword(e, p); await res.user.updateProfile({displayName: document.getElementById('reg-name').value}); }
            } catch(err) { alert(err.message); }
        }

        auth.onAuthStateChanged(user => {
            document.getElementById('auth-view').classList.toggle('hidden', !!user);
            document.getElementById('main-hub').classList.toggle('hidden', !user);
            if(user) { document.getElementById('user-display').innerText = user.displayName; updateCountdown(); loadMessages(); }
        });

        function showSec(id) {
            ['home','quiz','chat','profile','subject-detail','paper-list','quiz-play'].forEach(s => document.getElementById('sec-' + s).classList.add('hidden'));
            document.getElementById('sec-' + id).classList.remove('hidden');
            if(id === 'quiz') loadLeaderboard();
            if(id === 'profile') updateProfileResults();
        }

        // SUBJECT & PAPER LOGIC
        function openSubject(sub) {
            activeSubject = sub;
            showSec('subject-detail');
            document.getElementById('detail-subject-name').innerText = sub;
        }

        function showPaperList() {
            showSec('paper-list');
            const container = document.getElementById('paper-buttons-container');
            container.innerHTML = "";
            const papers = subjectPapers[activeSubject] || {};
            
            Object.keys(papers).forEach(paperName => {
                const btn = document.createElement('button');
                btn.className = "paper-btn w-full p-5 rounded-2xl text-left font-bold flex justify-between items-center";
                btn.innerHTML = `${paperName} <i class="fas fa-play-circle text-cyan-400"></i>`;
                btn.onclick = () => startPaperQuiz(paperName);
                container.appendChild(btn);
            });
        }

        function startPaperQuiz(paperName) {
            showSec('quiz-play');
            const qList = subjectPapers[activeSubject][paperName];
            loadQuiz(qList, paperName);
        }

        function loadQuiz(qList, paperTitle) {
            const qBox = document.getElementById('quiz-box');
            let currentQ = 0; sessionCorrect = 0; sessionWrong = 0;
            
            function renderQ() {
                canClick = true; const data = qList[currentQ];
                qBox.innerHTML = `
                    <h3 class="text-sm text-cyan-400 mb-4">${paperTitle} (${currentQ + 1}/${qList.length})</h3>
                    <p class="mb-6 font-bold text-xl">${data.q}</p>
                    <div class="grid gap-3">${data.a.map((opt, i) => `<button id="opt-${i}" onclick="checkAns(${i}, ${data.c})" class="p-4 glass text-left rounded-2xl transition hover:border-cyan-500">${opt}</button>`).join('')}</div>`;
            }

            window.checkAns = (sel, cor) => {
                if(!canClick) return; canClick = false;
                const sb = document.getElementById(`opt-${sel}`), cb = document.getElementById(`opt-${cor}`);
                if(sel === cor) { sb.classList.add('ans-correct'); sessionCorrect++; savePoints(10); } 
                else { sb.classList.add('ans-wrong'); cb.classList.add('ans-correct'); sessionWrong++; }
                setTimeout(() => { currentQ++; if(currentQ < qList.length) renderQ(); else showResultBtn(); }, 1000);
            };
            renderQ();
        }

        function showResultBtn() {
            document.getElementById('quiz-box').innerHTML = `<div class="text-center py-10"><i class="fas fa-check-circle text-5xl text-emerald-500 mb-4"></i><h3 class="text-2xl font-bold mb-4">Paper Finished!</h3><button onclick="showFinalReport()" class="bg-cyan-600 px-8 py-3 rounded-xl font-bold">ප්‍රතිඵල බලන්න</button></div>`;
        }

        function showFinalReport() {
            document.getElementById('quiz-box').innerHTML = `
                <div class="space-y-6 text-center">
                    <h3 class="text-xl font-bold text-cyan-400">ප්‍රතිඵල වාර්තාව</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-emerald-500/10 p-4 rounded-xl border border-emerald-500/20 text-emerald-400 font-bold">${sessionCorrect} Correct</div>
                        <div class="bg-red-500/10 p-4 rounded-xl border border-red-500/20 text-red-400 font-bold">${sessionWrong} Wrong</div>
                    </div>
                    <div class="glass p-6"><span class="text-xs opacity-50 block mb-1">SCORE</span><span class="text-4xl font-black">${sessionCorrect * 10}</span></div>
                    <button onclick="showSec('home')" class="w-full py-4 bg-cyan-600 rounded-2xl font-bold">Home</button>
                </div>`;
        }

        // DATABASE HELPERS
        function savePoints(p) {
            const u = auth.currentUser;
            rtdb.ref('users/' + u.uid).transaction(c => {
                if(!c) return {score:p, quizzesDone:1};
                return {score:(c.score||0)+p, quizzesDone:(c.quizzesDone||0)+1};
            });
            rtdb.ref('leaderboard/' + u.uid).update({ name:u.displayName, score: firebase.database.ServerValue.increment(p) });
        }

        function updateProfileResults() {
            rtdb.ref('users/' + auth.currentUser.uid).on('value', s => {
                const d = s.val(); if(d) { document.getElementById('res-total-points').innerText = d.score; document.getElementById('res-quiz-count').innerText = d.quizzesDone; }
            });
        }

        function loadLeaderboard() {
            rtdb.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', s => {
                const l = document.getElementById('leaderboard-list'); l.innerHTML = ""; let ps = [];
                s.forEach(c => ps.push(c.val()));
                ps.reverse().forEach((p, i) => { l.innerHTML += `<div class="leaderboard-row"><span>${p.name}</span><span class="text-cyan-400 font-bold">${p.score}</span></div>`; });
            });
        }

        // MESSAGES
        function sendMsg() {
            const i = document.getElementById('chat-msg'); if(!i.value.trim()) return;
            rtdb.ref('global_chat').push({name: auth.currentUser.displayName, text: i.value}); i.value = "";
        }
        function loadMessages() {
            rtdb.ref('global_chat').limitToLast(20).on('value', s => {
                const b = document.getElementById('chat-box'); b.innerHTML = "";
                s.forEach(c => { const m = c.val(); b.innerHTML += `<div class="p-3 rounded-2xl bg-white/5 max-w-[80%]"><span class="text-[10px] text-cyan-500 block font-bold">${m.name}</span>${m.text}</div>`; });
                b.scrollTop = b.scrollHeight;
            });
        }

        function updateCountdown() {
            const d = Math.floor((new Date("August 10, 2026") - new Date()) / 86400000);
            document.getElementById('days-count').innerText = d > 0 ? d : 0;
        }
    </script>
</body>
</html>
